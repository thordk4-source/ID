<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>e-Boks ID</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --crimson: #C8103E;
  --crimson-dark: #A00D32;
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --surface-2: #EBEBF0;
  --text: #1C1C1E;
  --subtext: #6C6C70;
  --border: #E5E5EA;
  --input-bg: #FFFFFF;
  --nav-bg: #FFFFFF;
}

html, body {
  height: 100%;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  overflow: hidden;
}

.phone {
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.dynamic-island,
.status-bar,
.status-left,
.status-time,
.status-icons {
  display: none;
}

.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  background: var(--bg);
  animation: fadeIn 0.18s ease;
}

.screen.active {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(5px); }
  to { opacity: 1; transform: none; }
}

.screen-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.screen-scroll::-webkit-scrollbar {
  display: none;
}

.nav-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 20px 8px;
  flex-shrink: 0;
  border-radius: 0;
}

#s-hjem > .nav-header {
  border-radius: 0;
}

.nav-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}

.nav-back {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--crimson);
  font-size: 17px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px 0;
}

.nav-back svg {
  width: 9px;
  height: 15px;
}

.page-title {
  font-size: 34px;
  font-weight: 800;
  color: var(--text);
  padding: 2px 20px 14px;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  background: transparent;
  border-top: none;
  padding: 0 16px max(28px, env(safe-area-inset-bottom));
  flex-shrink: 0;
  justify-content: center;
}

.tab-bar-pill {
  display: flex;
  background: #EBEBF0;
  border-radius: 50px;
  padding: 5px;
  gap: 4px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.10);
}
